services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:${RAF_KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${RAF_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      start_period: 15s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "example.events", "--partitions", "3", "--replication-factor", "1"]

  raf:
    build: .
    ports:
      - "127.0.0.1:${RAF_HTTP_PORT:-18080}:8080"
    environment:
      RAF_HTTP_ADDR: :8080
      RAF_KAFKA_BROKERS: kafka:9092
      RAF_PROTO_IMPORT_PATHS: /protos
      RAF_PROTO_FILES: event.proto
      RAF_TOPIC_TYPES: '{"example.events":"example.Event"}'
    volumes:
      - ./examples/proto:/protos:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 15s
